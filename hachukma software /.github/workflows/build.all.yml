name: Build All Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download Inno Setup
      run: |
        $url = "https://jrsoftware.org/download.php/is.exe"
        $path = "C:\inno-setup.exe"
        Invoke-WebRequest -Uri $url -OutFile $path
        & $path /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
      shell: powershell
    
    - name: Build Windows Installer
      run: |
        cd "Hachukma software\installers"
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      shell: cmd
    
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v3
      with:
        name: windows-installer
        path: Hachukma software/installers/Output/Hachukma-IME-Installer.exe
  
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        pip install py2app
    
    - name: Build macOS app bundle
      run: |
        cd "Hachukma software/installers"
        python setup_macos.py py2app
    
    - name: Create DMG installer
      run: |
        cd "Hachukma software/installers"
        bash create_dmg_macos.sh
    
    - name: Upload macOS Installer
      uses: actions/upload-artifact@v3
      with:
        name: macos-installer
        path: Hachukma software/installers/Hachukma-IME-Installer.dmg
  
  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download Windows Installer
      uses: actions/download-artifact@v3
      with:
        name: windows-installer
        path: ./installers
    
    - name: Download macOS Installer
      uses: actions/download-artifact@v3
      with:
        name: macos-installer
        path: ./installers
    
    - name: Create Release with Installers
      uses: softprops/action-gh-release@v1
      with:
        files: |
          installers/Hachukma-IME-Installer.exe
          installers/Hachukma-IME-Installer.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
